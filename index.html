<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if already locked
        }
      })();
    </script>
